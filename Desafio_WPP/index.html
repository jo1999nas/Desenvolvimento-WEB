<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-background">
        <div class="top-stripe"></div>
        <div class="app-container">
            <aside class="sidebar">
                <header class="sidebar-header">
                    <div class="user-avatar">
                        <img src="https://i.pravatar.cc/150?img=6" alt="Meu Perfil">
                    </div>
                    <div class="sidebar-header-actions">
                        <button class="icon-btn" title="Comunidades">
                            <span class="material-symbols-outlined">groups</span>
                        </button>
                        <button class="icon-btn" title="Status">
                            <span class="material-symbols-outlined">donut_large</span>
                        </button>
                        <button class="icon-btn" title="Canais">
                            <span class="material-symbols-outlined">chat_add_on</span>
                        </button>
                        <button class="icon-btn" title="Nova conversa">
                            <span class="material-symbols-outlined">add_comment</span>
                        </button>
                        <button class="icon-btn" title="Mais opções">
                            <span class="material-symbols-outlined">more_vert</span>
                        </button>
                    </div>
                </header>

                <div class="search-container">
                    <div class="search-input-wrapper">
                        <span class="material-symbols-outlined search-icon">search</span>
                        <input type="text" placeholder="Pesquisar ou começar uma nova conversa" id="search-input">
                    </div>
                    <button class="icon-btn filter-btn" title="Conversas não lidas">
                        <span class="material-symbols-outlined">filter_list</span>
                    </button>
                </div>

                <div class="contact-list" id="contact-list">
                    <!-- Feito pelo JS -->
                </div>
            </aside>

            <main class="chat-panel">
                <header class="chat-header">
                    <div class="active-contact-info">
                        <div class="contact-avatar">
                            <img id="active-avatar" src="" alt="Foto do Contato">
                        </div>
                        <div class="contact-text-info">
                            <h2 id="active-name">Nome do Contato</h2>
                            <p id="active-status" class="contact-status">online</p>
                        </div>
                    </div>
                    <div class="chat-header-actions">
                        <button class="icon-btn" title="Pesquisar na conversa">
                            <span class="material-symbols-outlined">search</span>
                        </button>
                        <button class="icon-btn" title="Mais opções">
                            <span class="material-symbols-outlined">more_vert</span>
                        </button>
                    </div>
                </header>

                <div class="chat-body" id="chat-body">
                    <div class="encryption-notice">
                        <span class="material-symbols-outlined lock-icon">lock</span>
                        Texto importante sobre criptografia e segurança.
                    </div>
                    <div id="messages-container" class="messages-container"></div>
                </div>

                <footer class="chat-footer">
                    <div class="chat-footer-actions">
                        <button class="icon-btn" title="Emojis">
                            <span class="material-symbols-outlined">sentiment_satisfied</span>
                        </button>
                        <button class="icon-btn" title="Anexar">
                            <span class="material-symbols-outlined">attach_file</span>
                        </button>
                    </div>
                    <div class="message-input-wrapper">
                        <input type="text" id="message-input" placeholder="Digite uma mensagem" autocomplete="off">
                    </div>
                    <button class="icon-btn send-btn" id="send-btn" title="Enviar mensagem">
                        <span class="material-symbols-outlined" id="send-icon">send</span>
                    </button>
                </footer>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
